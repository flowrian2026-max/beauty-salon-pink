name: Apply optimized Pinko gold-chrome hero media

on:
  push:
    branches:
      - fix/pinko-gold-chrome-scroll
    paths:
      - .github/workflows/apply-pinko-hero-media.yml

permissions:
  contents: write

jobs:
  optimize-hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pinko-gold-chrome-scroll
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Replace hero media with gold-graded, seek-friendly assets
        run: |
          curl -fL 'https://d2ol7oe51mr4n9.cloudfront.net/user_3KyoBPAMzbJTHii9o99E3up6QL9/c2031e72-302b-4191-abb6-758ebc32ea79.mp4' -o src/assets/chrome-melt.mp4
          curl -fL 'https://d2ol7oe51mr4n9.cloudfront.net/user_3KyoBPAMzbJTHii9o99E3up6QL9/bc6a5989-25a2-432d-812c-99e9a277dcc7.jpg' -o src/assets/chrome-melt-poster.jpg
          test -s src/assets/chrome-melt.mp4
          test -s src/assets/chrome-melt-poster.jpg
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run tests
        run: bun run test
      - name: Build production bundle
        run: bun run build
      - name: Commit optimized hero media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/chrome-melt.mp4 src/assets/chrome-melt-poster.jpg
          git commit -m "Optimize gold chrome hero media for scroll scrubbing"
          git push origin HEAD:fix/pinko-gold-chrome-scroll
